name: Scrape Tee Times

on:
  schedule:
    - cron: '15 1 * * *'   # 매일 새벽 1:15 UTC (방콕 08:15)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 rapidfuzz lxml

      - name: Run price scraper (refresh prices)
        run: python scripts/price_scraper.py

      - name: Run tee scraper (generate slots from prices)
        run: python scripts/tee_scraper.py

      - name: Check for changes
        id: diff
        run: git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add web-golf/data/price_matrix.json web-golf/public/tee_times.json
          git commit -m "data: tee_times + prices update [skip ci]"
          git push

      - name: Install Vercel CLI
        if: steps.diff.outputs.changed == 'true'
        run: npm install -g vercel@latest

      - name: Redeploy to Vercel
        if: steps.diff.outputs.changed == 'true'
        working-directory: web-golf
        run: vercel --prod --yes --archive=tgz
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
