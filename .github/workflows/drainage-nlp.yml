name: Drainage NLP

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  nlp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install rapidfuzz

      - name: Run NLP
        run: python scripts/drainage_nlp.py

      - name: Check for changes
        id: diff
        run: git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add web-golf/data/master_db.json
          git commit -m "data: drainage scores update [skip ci]"
          git push

      - name: Install Vercel CLI
        if: steps.diff.outputs.changed == 'true'
        run: npm install -g vercel@latest

      - name: Redeploy to Vercel
        if: steps.diff.outputs.changed == 'true'
        working-directory: web-golf
        run: vercel --prod --yes --archive=tgz
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
