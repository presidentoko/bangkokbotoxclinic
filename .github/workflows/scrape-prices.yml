name: Scrape Prices

on:
  # Once a day, 03:00 Bangkok. It used to be every 6 hours, and because the
  # scraper stamped a fresh scraped_at on every row the diff was never empty —
  # so each run committed and triggered a full 2,274-page production rebuild,
  # about five a day, whether or not a single price had moved.
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 rapidfuzz

      - name: Scrape every booking provider and rebuild the registry
        run: python scripts/price_scraper.py

      - name: Check for real changes
        id: diff
        # Ignore lines that only carry a timestamp: generated_at and
        # scraped_at change on every run by definition, and deploying for
        # them costs a full rebuild and buys nothing.
        run: |
          if git diff --quiet -I 'generated_at' -I 'scraped_at' -- web-golf/data; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add web-golf/data/providers web-golf/data/provider_registry.json
          git commit -m "data: booking provider rates update [skip ci]"
          git push

      - name: Install Vercel CLI
        if: steps.diff.outputs.changed == 'true'
        run: npm install -g vercel@latest

      - name: Redeploy to Vercel
        if: steps.diff.outputs.changed == 'true'
        working-directory: web-golf
        run: vercel --prod --yes --archive=tgz
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
